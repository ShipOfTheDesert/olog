name: lint

on:
  pull_request:
    branches:
      - main

# Cancel any previous runs of this workflow for the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-doc:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest
        ocaml-version:
          - "5.2.0"
          - "5.3.0"
          - "5.4.0"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tree
        uses: actions/checkout@v6
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
          dune-cache: true
      - name: Install dependencies
        run: opam install -y odoc
      - uses: ocaml/setup-ocaml/lint-doc@v3

  lint-fmt:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest
        ocaml-version:
          - "5.2.0"
          - "5.3.0"
          - "5.4.0"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tree
        uses: actions/checkout@v6
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
          dune-cache: true
      - name: Install dependencies
        run: opam install -y ocamlformat
      - uses: ocaml/setup-ocaml/lint-fmt@v3

  lint-opam:
    strategy:
    fail-fast: false
    matrix:
      os:
        - ubuntu-latest
        # - macos-latest
      ocaml-version:
        - "5.2.0"
        - "5.3.0"
        - "5.4.0"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tree
        uses: actions/checkout@v6
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
          dune-cache: true
      - name: Install dependencies
        run: opam install -y opam-dune-lint
      - uses: ocaml/setup-ocaml/lint-opam@v3
